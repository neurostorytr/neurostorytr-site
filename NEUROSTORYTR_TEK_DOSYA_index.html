let audioCtx=null;
let soundEnabled=true;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function toggleSound(){soundEnabled=!soundEnabled;const btn=document.getElementById(&#x27;snd-btn&#x27;);if(btn)btn.textContent=soundEnabled?&#x27;🔊&#x27;:&#x27;🔇&#x27;;}

function playEngine(throttle){
  if(!soundEnabled)return;
  try{
    const a=getAudio();
    const osc=a.createOscillator();
    const gain=a.createGain();
    const dist=a.createWaveShaper();
    const curve=new Float32Array(256);
    for(let i=0;i&lt;256;i++){const x=i*2/256-1;curve[i]=x*0.8;}
    dist.curve=curve;
    osc.type=&#x27;sawtooth&#x27;;
    osc.frequency.value=80+throttle*1.5;
    gain.gain.setValueAtTime(0,a.currentTime);
    gain.gain.linearRampToValueAtTime(throttle/1000,a.currentTime+.05);
    gain.gain.linearRampToValueAtTime(0,a.currentTime+.12);
    osc.connect(dist); dist.connect(gain); gain.connect(a.destination);
    osc.start(); osc.stop(a.currentTime+.12);
  }catch(e){}
}

function playGunshot(){
  if(!soundEnabled)return;
  try{
    const a=getAudio();
    const buf=a.createBuffer(1,a.sampleRate*.08,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i&lt;d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const src=a.createBufferSource();
    const gain=a.createGain();
    gain.gain.value=0.3;
    src.buffer=buf; src.connect(gain); gain.connect(a.destination);
    src.start();
  }catch(e){}
}

function playExplosion(){
  if(!soundEnabled)return;
  try{
    const a=getAudio();
    const buf=a.createBuffer(1,a.sampleRate*.4,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i&lt;d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5)*0.8;
    const src=a.createBufferSource();
    const gain=a.createGain();
    const filt=a.createBiquadFilter();
    filt.type=&#x27;lowpass&#x27;; filt.frequency.value=400;
    gain.gain.value=0.6;
    src.buffer=buf; src.connect(filt); filt.connect(gain); gain.connect(a.destination);
    src.start();
  }catch(e){}
}

function playWin(){
  if(!soundEnabled)return;
  try{
    const a=getAudio();
    [0,.2,.4,.6].forEach((t,i)=&gt;{
      const osc=a.createOscillator();
      const gain=a.createGain();
      osc.frequency.value=[523,659,784,1046][i];
      gain.gain.setValueAtTime(0,a.currentTime+t);
      gain.gain.linearRampToValueAtTime(.25,a.currentTime+t+.05);
      gain.gain.linearRampToValueAtTime(0,a.currentTime+t+.25);
      osc.connect(gain); gain.connect(a.destination);
      osc.start(a.currentTime+t); osc.stop(a.currentTime+t+.3);
    });
  }catch(e){}
}

const joy={x:0,y:0,tid:null};
const joyBase=document.getElementById(&#x27;joy-base&#x27;);
const joyKnob=document.getElementById(&#x27;joy-knob&#x27;);
const JR=62;

function joyMove(touch){
  const r=joyBase.getBoundingClientRect();
  let dx=touch.clientX-(r.left+r.width/2);
  let dy=touch.clientY-(r.top+r.height/2);
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d&gt;JR){dx=dx/d*JR;dy=dy/d*JR;}
  // Dead zone — merkeze çok yakınsa sıfır say
  const deadzone=0.08;
  const nx=dx/JR; const ny=dy/JR;
  joy.x=Math.abs(nx)&gt;deadzone?(nx&gt;0?1:-1)*(Math.abs(nx)-deadzone)/(1-deadzone):0;
  joy.y=Math.abs(ny)&gt;deadzone?(ny&gt;0?1:-1)*(Math.abs(ny)-deadzone)/(1-deadzone):0;
  joyKnob.style.left=(80+dx)+&#x27;px&#x27;;
  joyKnob.style.top=(80+dy)+&#x27;px&#x27;;
  joyKnob.style.transform=&#x27;translate(-50%,-50%)&#x27;;
}
function joyReset(){joy.x=0;joy.y=0;joyKnob.style.left=&#x27;50%&#x27;;joyKnob.style.top=&#x27;50%&#x27;;joyKnob.style.transform=&#x27;translate(-50%,-50%)&#x27;;}

joyBase.addEventListener(&#x27;touchstart&#x27;,e=&gt;{e.preventDefault();joy.tid=e.changedTouches[0].identifier;joyMove(e.changedTouches[0]);},{passive:false});
document.addEventListener(&#x27;touchmove&#x27;,e=&gt;{for(let t of e.changedTouches)if(t.identifier===joy.tid){e.preventDefault();joyMove(t);break;}},{passive:false});
document.addEventListener(&#x27;touchend&#x27;,e=&gt;{for(let t of e.changedTouches)if(t.identifier===joy.tid){joyReset();joy.tid=null;break;}});

function getNearestEnemy(){
  // Ekran merkezine (crosshair) en yakın düşmanı bul
  let best=null, bestDist=Infinity;
  enemies.forEach(e=&gt;{
    if(!e.alive)return;
    const sx=W/2+(e.x-plane.x)*.16;
    const sy=H*.52+(e.y-plane.y)*.12;
    // Ekran merkezine uzaklık
    const dx=sx-W/2, dy=sy-H/2;
    const screenDist=Math.sqrt(dx*dx+dy*dy);
    if(screenDist&lt;120 &amp;&amp; screenDist&lt;bestDist){bestDist=screenDist;best=e;}
  });
  return best;
}

function fire(){

  const w=wpnList[wIdx];

  // AIM ASSIST — crosshair yakınında düşman varsa ona doğru ateş et
  const target=getNearestEnemy();
  let bx=Math.cos(plane.heading)*w.speed;
  let by=Math.sin(plane.heading)*w.speed;
  if(target){
    lockedTarget=target;
    const tdx=target.x-plane.x, tdy=target.y-plane.y;
    const dist=Math.sqrt(tdx*tdx+tdy*tdy);
    const tAngle=Math.atan2(tdy,tdx);
    // Mesafeye göre mermi hızı ile öngörü yap
    const timeToHit=dist/w.speed;
    const predX=target.x+(Math.random()-.5)*0.5*timeToHit;
    const predY=target.y+(Math.random()-.5)*0.5*timeToHit;

    const plen=Math.sqrt(pdx*pdx+pdy*pdy);
    bx=pdx/plen*w.speed;
    by=pdy/plen*w.speed;
  }

let last=0;
let engineSndTimer=0;

function update(dt){
  if(gameState!==&#x27;playing&#x27;) return;
  if(fireCD&gt;0) fireCD-=dt*60;

  // Motor sesi
  engineSndTimer-=dt;
  if(engineSndTimer&lt;=0&amp;&amp;plane.throttle&gt;10){playEngine(plane.throttle);engineSndTimer=.08;}

  // Yön
  // Yumuşak dönüş — anlık değil, hedefe doğru yaklaş
  const targetHeadingRate = joy.x * 2.2;
  plane.headingRate = (plane.headingRate||0)*0.7 + targetHeadingRate*0.3;
  plane.heading += plane.headingRate * dt;

  // Pitch yumuşat
  const targetPitch = joy.y * 0.8;
  plane.pitch = plane.pitch*0.75 + targetPitch*0.25;

  // Roll joystick&#x27;e anlık tepki
  plane.roll = plane.roll*0.7 + joy.x*0.3;

  // Hız
  const ms=plane.throttle*.85;
  plane.speed+=(ms-plane.speed)*dt*1.6;

  // Konum
  plane.x+=Math.cos(plane.heading)*plane.speed*dt*55;
  plane.y+=Math.sin(plane.heading)*plane.speed*dt*55;

  // İrtifa
  plane.alt=Math.max(0,plane.alt-plane.pitch*plane.speed*dt*22);
  if(plane.alt&lt;=0){
    spawnExplosion(plane.x,plane.y,true);
    endGame(false);
    return;
  }

  // G
  plane.gForce=1+Math.abs(plane.pitch)*plane.speed*.004;

  // Yakıt
  if(plane.throttle&gt;0)plane.fuel=Math.max(0,plane.fuel-plane.throttle*.0004*dt);

  // Görev 1
  if(plane.alt&gt;150&amp;&amp;!mDone[0])advMission(0);

  // Stall
  if(plane.speed&lt;2&amp;&amp;plane.alt&gt;80&amp;&amp;plane.throttle&lt;10)showWarn(&#x27;w-stall&#x27;,true,500);
  else document.getElementById(&#x27;w-stall&#x27;).style.display=&#x27;none&#x27;;
  if(plane.fuel&lt;=0){endGame(false);return;}
  if(plane.fuel&lt;15)document.getElementById(&#x27;w-fuel&#x27;).style.display=&#x27;block&#x27;;
  else document.getElementById(&#x27;w-fuel&#x27;).style.display=&#x27;none&#x27;;

  // Mermi
  for(let i=bullets.length-1;i&gt;=0;i--){
    const b=bullets[i];
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length&gt;8)b.trail.shift();
    b.x+=b.dx; b.y+=b.dy; b.life--;
    if(b.life&lt;=0){bullets.splice(i,1);continue;}
    let hit=false;
    for(let j=enemies.length-1;j&gt;=0;j--){
      const e=enemies[j];
      if(!e.alive)continue;
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy&lt;1600){
        e.hp-=b.dmg; hit=true;
        if(e.hp&lt;=0){
          e.alive=false;
          spawnExplosion(e.x,e.y,true);
          showWarn(&#x27;w-kill&#x27;,true,1500);
          updateIFF();
          const alive=enemies.filter(x=&gt;x.alive).length;
          document.getElementById(&#x27;h-rtgt&#x27;).textContent=alive+&#x27; HEDEF&#x27;;
          // wave system handles win condition
        } else {
          spawnExplosion(e.x,e.y,false);
        }
        break;
      }
    }
    if(hit){bullets.splice(i,1);}
  }

  // Düşman AI
  enemies.forEach(e=&gt;{
    if(!e.alive)return;
    const dx=plane.x-e.x,dy=plane.y-e.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    // Hareket
    e.x+=dx/d*e.spd;
    e.y+=dy/d*e.spd;
    // Yakın çarpışma
    if(d&lt;25){
      plane.armor=Math.max(0,plane.armor-0.5);
      showWarn(&#x27;w-hit&#x27;,true,600);
      if(plane.armor&lt;=0){endGame(false);return;}
    }
    // Düşman ateşi
    e.fireTimer--;
    if(e.fireTimer&lt;=0&amp;&amp;d&lt;600){
      e.fireTimer=120+Math.random()*120;
      // Düşman mermisi
      const ang=Math.atan2(plane.y-e.y,plane.x-e.x);
      const miss=(Math.random()-.5)*0.4;
      bullets.push({x:e.x,y:e.y,dx:Math.cos(ang+miss)*12,dy:Math.sin(ang+miss)*12,life:60,dmg:0,size:3,color:&#x27;#ff0000&#x27;,enemy:true,trail:[]});
      if(d&lt;300)showWarn(&#x27;w-lock&#x27;,true,800);
    }
  });

  // Düşman mermileri plane&#x27;e isabet
  for(let i=bullets.length-1;i&gt;=0;i--){
    const b=bullets[i];
    if(!b.enemy)continue;
    const dx=b.x-plane.x,dy=b.y-plane.y;
    if(dx*dx+dy*dy&lt;400){
      plane.armor=Math.max(0,plane.armor-8);
      showWarn(&#x27;w-hit&#x27;,true,700);
      playAlert();
      spawnExplosion(plane.x,plane.y,false);
      bullets.splice(i,1);
      if(plane.armor&lt;=0){endGame(false);return;}
    }
  }

  // Partiküller
  for(let i=particles.length-1;i&gt;=0;i--){
    const p=particles[i];
    p.x+=p.dx*.9; p.y+=p.dy*.9; p.dx*=.92; p.dy*=.92; p.life--;
    if(p.life&lt;=0)particles.splice(i,1);
  }
  for(let i=explosions.length-1;i&gt;=0;i--){
    const e=explosions[i];
    e.r+=e.maxR/e.maxLife*2; e.life--;
    if(e.life&lt;=0)explosions.splice(i,1);
  }

  radarSweep+=dt*2.2;
  updateWave(dt);
  // Dost uçak hareketi
  friendlies.forEach(f=&gt;{
    if(!f.alive)return;
    f.moveAngle+=dt*0.3;
    f.x+=Math.cos(f.moveAngle)*f.spd*2;
    f.y+=Math.sin(f.moveAngle)*f.spd*2;
  });
  // Dost uçağa çarpışma kontrolü (mermi)
  for(let i=bullets.length-1;i&gt;=0;i--){
    const b=bullets[i];
    if(b.enemy)continue;
    for(let j=friendlies.length-1;j&gt;=0;j--){
      const f=friendlies[j];
      if(!f.alive)continue;
      const dx=b.x-f.x,dy=b.y-f.y;
      if(dx*dx+dy*dy&lt;1200){
        f.hp--;
        score=Math.max(0,score-500);
        gameStats.friendlyFire++;
        showBanner(lang===&#x27;TR&#x27;?&#x27;⚠ DOST ATEŞİ! -500 PUAN ⚠&#x27;:&#x27;⚠ FUEGO AMIGO! -500 PTS ⚠&#x27;,2000);
        spawnExplosion(f.x,f.y,false);
        bullets.splice(i,1);
        if(f.hp&lt;=0){f.alive=false;score=Math.max(0,score-1000);showBanner(lang===&#x27;TR&#x27;?&#x27;✖ DOST İMHA! -1000 PUAN&#x27;:&#x27;✖ ALIADO DESTRUIDO! -1000 PTS&#x27;,2500);}
        break;
      }
    }
  }
}

function endGame(win){
  gameState=win?&#x27;win&#x27;:&#x27;dead&#x27;;
  const L=LANGS[lang];
  const elapsed=Math.round((Date.now()-gameStats.startTime)/1000);
  const mins=Math.floor(elapsed/60), secs=elapsed%60;

  document.getElementById(&#x27;ov-icon&#x27;).textContent=win?&#x27;🏆&#x27;:&#x27;💀&#x27;;
  document.getElementById(&#x27;ov-title&#x27;).textContent=win?L.win:L.gameover;
  document.getElementById(&#x27;ov-title&#x27;).style.color=win?&#x27;#00ff88&#x27;:&#x27;#ff3344&#x27;;
  let deathMsg=&#x27;ŞAHİN TC İMHA EDİLDİ&#x27;;
  if(!win &amp;&amp; plane.fuel&lt;=0) deathMsg=lang===&#x27;TR&#x27;?&#x27;YAKITSIZ KALDI!&#x27;:lang===&#x27;ES&#x27;?&#x27;¡SIN COMBUSTIBLE!&#x27;:&#x27;FUEL DEPLETED!&#x27;;
  else if(!win &amp;&amp; plane.alt&lt;=0) deathMsg=lang===&#x27;TR&#x27;?&#x27;YERE ÇARPTI!&#x27;:lang===&#x27;ES&#x27;?&#x27;¡IMPACTO CON EL SUELO!&#x27;:&#x27;GROUND IMPACT!&#x27;;
  document.getElementById(&#x27;ov-sub&#x27;).textContent=win?&#x27;TÜM DALGALAR TEMİZLENDİ!&#x27;:deathMsg;
  document.getElementById(&#x27;ov-score&#x27;).textContent=&#x27;⭐ &#x27;+score+&#x27; PUAN&#x27;;

  // İstatistikler
  document.getElementById(&#x27;ov-stats&#x27;).innerHTML=
    &#x27;&lt;div&gt;⏱ SÜRE: &#x27;+mins+&#x27;dk &#x27;+secs+&#x27;sn&lt;/div&gt;&#x27;+
    &#x27;&lt;div&gt;🎯 İMHA: &#x27;+gameStats.kills+&#x27; düşman&lt;/div&gt;&#x27;+
    &#x27;&lt;div&gt;💥 ATIŞ: &#x27;+gameStats.shotsFired+&#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div&gt;🟢 DALGA: &#x27;+wave+&#x27;/&#x27;+totalWaves+&#x27;&lt;/div&gt;&#x27;+
    (gameStats.friendlyFire&gt;0?&#x27;&lt;div style=&quot;color:#ff6666&quot;&gt;⚠ DOST ATEŞİ: &#x27;+gameStats.friendlyFire+&#x27;x&lt;/div&gt;&#x27;:&#x27;&lt;div style=&quot;color:#00ff88&quot;&gt;✓ DOST ATEŞİ YOK&lt;/div&gt;&#x27;);

  // Rütbe
  const rank=getRank(score);
  document.getElementById(&#x27;ov-rank&#x27;).textContent=rank.r;
  document.getElementById(&#x27;ov-rank&#x27;).style.color=rank.c;

  // Skor kaydet ve tabloyu göster
  const lb=saveScore(score,wave);
  document.getElementById(&#x27;ov-leaderboard&#x27;).innerHTML=&#x27;&lt;div style=&quot;color:rgba(255,204,0,.6);letter-spacing:2px;margin-bottom:4px;&quot;&gt;EN İYİ SKORLAR&lt;/div&gt;&#x27;+
    lb.map((e,i)=&gt;&#x27;&lt;div&gt;&#x27;+(i+1)+&#x27;. &#x27;+e.score+&#x27; puan — Dalga &#x27;+e.wave+&#x27; (&#x27;+e.diff+&#x27;) &#x27;+e.date+&#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;);

  document.getElementById(&#x27;overlay&#x27;).style.display=&#x27;flex&#x27;;
  if(!win){playExplosion();}else{playWin();}
}

function restartGame(){
  gameState=&#x27;playing&#x27;;
  score=0;
  plane.x=0;plane.y=0;plane.alt=200;plane.speed=0;plane.throttle=0;
  plane.heading=0;plane.pitch=0;plane.fuel=100;plane.armor=100;
  bullets=[];particles=[];explosions=[];
  mDone=[false,false,false,false,false];mActive=0;
  wIdx=0;
  wpnList.forEach(w=&gt;{if(w.id===&#x27;w-gun&#x27;)w.count=500;else if(w.id===&#x27;w-aim&#x27;)w.count=4;else w.count=2;document.getElementById(w.id).textContent=w.count;});
  joyReset(); wave=1; waveQueue=[]; waveCleared=false; waveSpawnTimer=0; friendlies=[];
  gameStats={kills:0,friendlyFire:0,wavesCleared:0,shotsFired:0,startTime:Date.now()};
  score=0;
  document.getElementById(&#x27;overlay&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;hud&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;minimap-wrap&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;briefing&#x27;).style.display=&#x27;flex&#x27;;
  const ac=document.getElementById(&#x27;arrow-cv&#x27;); if(ac)ac.remove();
}

let bgStars=[];
function initStars(){bgStars=[];for(let i=0;i&lt;60;i++)bgStars.push({x:Math.random(),y:Math.random()*.4,s:Math.random()*1.5+.5,b:Math.random()*.6+.2});}

// Arazi şeritleri
let terrainSegs=[];
function initTerrain(){
  terrainSegs=[];
  for(let i=0;i&lt;12;i++){
    terrainSegs.push({x:Math.random()*4000-2000,y:Math.random()*4000-2000,type:Math.random()&gt;.5?&#x27;mountain&#x27;:&#x27;plain&#x27;,h:Math.random()*60+20,w:Math.random()*200+80,color:`hsl(${100+Math.random()*30},${40+Math.random()*20}%,${15+Math.random()*12}%)`});
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // ── GÖKYÜZÜ ──
  const skyG=ctx.createLinearGradient(0,0,0,H*.6);
  skyG.addColorStop(0,&#x27;#050d1a&#x27;);
  skyG.addColorStop(.5,&#x27;#0d2a48&#x27;);
  skyG.addColorStop(1,&#x27;#1a5a8a&#x27;);
  ctx.fillStyle=skyG; ctx.fillRect(0,0,W,H*.6);

  // Yıldızlar
  bgStars.forEach(s=&gt;{
    ctx.fillStyle=`rgba(255,255,255,${s.b})`;
    ctx.fillRect(s.x*W,s.y*H*.4,s.s,s.s);
  });

  // Güneş
  const sunX=W*.8, sunY=H*.1;
  const sunG=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,80);
  sunG.addColorStop(0,&#x27;rgba(255,240,180,.6)&#x27;);
  sunG.addColorStop(.3,&#x27;rgba(255,200,80,.2)&#x27;);
  sunG.addColorStop(1,&#x27;rgba(255,150,0,0)&#x27;);
  ctx.fillStyle=sunG; ctx.fillRect(0,0,W,H*.5);

  // ── YER ──
  const gndG=ctx.createLinearGradient(0,H*.58,0,H);
  gndG.addColorStop(0,&#x27;#1a3a0a&#x27;);
  gndG.addColorStop(.3,&#x27;#2a5010&#x27;);
  gndG.addColorStop(.6,&#x27;#1e4008&#x27;);
  gndG.addColorStop(1,&#x27;#0d1f04&#x27;);
  ctx.fillStyle=gndG; ctx.fillRect(0,H*.58,W,H*.42);

  // Arazi detayları (dağlar/tepeler)
  terrainSegs.forEach(seg=&gt;{
    const sx=W/2+(seg.x-plane.x)*.12;
    const sy=H*.6;
    if(sx&lt;-200||sx&gt;W+200) return;
    ctx.fillStyle=seg.color;
    if(seg.type===&#x27;mountain&#x27;){
      ctx.beginPath(); ctx.moveTo(sx-seg.w/2,sy); ctx.lineTo(sx,sy-seg.h*1.5); ctx.lineTo(sx+seg.w/2,sy); ctx.closePath(); ctx.fill();
      ctx.fillStyle=&#x27;rgba(255,255,255,.15)&#x27;;
      ctx.beginPath(); ctx.moveTo(sx-10,sy-seg.h*1.2); ctx.lineTo(sx,sy-seg.h*1.5); ctx.lineTo(sx+10,sy-seg.h*1.2); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(sx,sy,seg.w,seg.h*.5,0,0,Math.PI,true); ctx.fill();
    }
  });

  // Izgara (hız hissi)
  ctx.save();
  const gxo=((-plane.x*.08)%60+60)%60;
  const gyo=((-plane.y*.08)%60+60)%60;
  ctx.strokeStyle=&#x27;rgba(255,255,255,.025)&#x27;; ctx.lineWidth=1;
  for(let x=gxo-60;x&lt;W+60;x+=60){ctx.beginPath();ctx.moveTo(x,H*.35);ctx.lineTo(x-20,H*.6);ctx.stroke();}
  for(let y=0;y&lt;4;y++){const yy=H*.4+y*(H*.05);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();}
  ctx.restore();

  // Yol/nehir
  ctx.save();
  const ry=H*.65;
  ctx.strokeStyle=&#x27;rgba(100,180,255,.12)&#x27;; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(0,ry); ctx.bezierCurveTo(W*.3,ry-30,W*.7,ry+30,W,ry); ctx.stroke();
  ctx.restore();

  // ── DÜŞMANLAR ──
  enemies.forEach(e=&gt;{
    if(!e.alive)return;
    const sx=W/2+(e.x-plane.x)*.16;
    const sy=H*.52+(e.y-plane.y)*.12;
    if(sx&lt;-60||sx&gt;W+60||sy&lt;40||sy&gt;H-.15*H) return;
    ctx.save(); ctx.translate(sx,sy);
    const ang=Math.atan2(plane.y-e.y,plane.x-e.x);
    ctx.rotate(ang);
    if(e.type===&#x27;jet&#x27;){
      ctx.fillStyle=&#x27;#8b0000&#x27;;
      ctx.beginPath(); ctx.ellipse(0,0,20,6,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=&#x27;#6b0000&#x27;;
      ctx.beginPath(); ctx.moveTo(-8,-4); ctx.lineTo(6,-14); ctx.lineTo(8,-12); ctx.lineTo(-5,-3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-8,4); ctx.lineTo(6,14); ctx.lineTo(8,12); ctx.lineTo(-5,3); ctx.closePath(); ctx.fill();
      ctx.fillStyle=&#x27;#aa0000&#x27;; ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(28,-3); ctx.lineTo(28,3); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle=&#x27;#5a0000&#x27;;
      ctx.fillRect(-12,-5,24,10);
      ctx.fillStyle=&#x27;#8b0000&#x27;;
      ctx.fillRect(-4,-15,8,15);
    }
    // HP bar
    ctx.fillStyle=&#x27;rgba(0,0,0,.5)&#x27;; ctx.fillRect(-15,-22,30,4);
    ctx.fillStyle=e.hp&gt;2?&#x27;#00ff88&#x27;:e.hp&gt;1?&#x27;#ffcc00&#x27;:&#x27;#ff3344&#x27;;
    ctx.fillRect(-15,-22,30*(e.hp/(e.type===&#x27;sam&#x27;?2:3)),4);
    // ID etiket
    ctx.fillStyle=&#x27;#ff5555&#x27;; ctx.font=&#x27;7px monospace&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(e.id,0,-26);
    // Hedef halkası
    ctx.strokeStyle=&#x27;rgba(255,51,68,.4)&#x27;; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  });

  // ── DOST UÇAKLAR ──
  friendlies.forEach(f=&gt;{
    if(!f.alive)return;
    const sx=W/2+(f.x-plane.x)*.16;
    const sy=H*.52+(f.y-plane.y)*.12;
    if(sx&lt;-60||sx&gt;W+60||sy&lt;40||sy&gt;H*.9)return;
    ctx.save(); ctx.translate(sx,sy);
    const ang=Math.atan2(plane.y-f.y,plane.x-f.x);
    ctx.rotate(ang+Math.PI);
    // Gövde — gri metalik (İspanya uçağı)
    const fg2=ctx.createLinearGradient(-18,0,18,0);
    fg2.addColorStop(0,&#x27;#555&#x27;); fg2.addColorStop(.5,&#x27;#bbb&#x27;); fg2.addColorStop(1,&#x27;#666&#x27;);
    ctx.fillStyle=fg2;
    ctx.beginPath(); ctx.ellipse(0,0,18,5,0,0,Math.PI*2); ctx.fill();
    // Kanatlar
    ctx.fillStyle=&#x27;#999&#x27;;
    ctx.beginPath(); ctx.moveTo(-6,-3); ctx.lineTo(5,-12); ctx.lineTo(7,-10); ctx.lineTo(-4,-2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6,3); ctx.lineTo(5,12); ctx.lineTo(7,10); ctx.lineTo(-4,2); ctx.closePath(); ctx.fill();
    // Burun
    ctx.fillStyle=&#x27;#888&#x27;; ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(24,-3); ctx.lineTo(24,3); ctx.closePath(); ctx.fill();
    // Kuyrukta İspanya bayrağı rozeti
    ctx.save();
    ctx.translate(-14,-6);
    // Kırmızı üst şerit
    ctx.fillStyle=&#x27;rgba(196,10,35,.9)&#x27;; ctx.fillRect(0,-5,10,3.3);
    // Sarı orta şerit
    ctx.fillStyle=&#x27;rgba(255,196,0,.95)&#x27;; ctx.fillRect(0,-1.7,10,3.4);
    // Kırmızı alt şerit
    ctx.fillStyle=&#x27;rgba(196,10,35,.9)&#x27;; ctx.fillRect(0,1.7,10,3.3);
    // İspanya arması — basit kalkan
    ctx.fillStyle=&#x27;rgba(150,8,28,.9)&#x27;;
    ctx.beginPath(); ctx.arc(4,0,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;rgba(255,220,0,.9)&#x27;;
    ctx.beginPath(); ctx.arc(4,0,1.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // IFF yeşil ışık
    ctx.fillStyle=&#x27;rgba(0,255,136,.8)&#x27;;
    ctx.beginPath(); ctx.arc(0,-8,3,0,Math.PI*2); ctx.fill();
    // Etiket
    ctx.fillStyle=&#x27;#00ff88&#x27;; ctx.font=&#x27;7px monospace&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(f.id,0,-20);
    // DOST halkası
    ctx.strokeStyle=&#x27;rgba(0,255,136,.5)&#x27;; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    // HP bar
    ctx.fillStyle=&#x27;rgba(0,0,0,.5)&#x27;; ctx.fillRect(-12,-16,24,3);
    ctx.fillStyle=&#x27;#00ff88&#x27;; ctx.fillRect(-12,-16,24*(f.hp/3),3);
    ctx.restore();
  });

  // ── MERMİLER ──
  bullets.forEach(b=&gt;{
    const sx=W/2+(b.x-plane.x)*.16;
    const sy=H*.52+(b.y-plane.y)*.12;
    // İz
    if(b.trail.length&gt;1){
      ctx.save(); ctx.beginPath();
      b.trail.forEach((pt,i)=&gt;{
        const tx=W/2+(pt.x-plane.x)*.16;
        const ty=H*.52+(pt.y-plane.y)*.12;
        i===0?ctx.moveTo(tx,ty):ctx.lineTo(tx,ty);
      });
      ctx.strokeStyle=b.enemy?&#x27;rgba(255,0,0,.3)&#x27;:`rgba(255,220,0,.3)`;
      ctx.lineWidth=b.size*.6; ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle=b.color;
    ctx.beginPath(); ctx.arc(sx,sy,b.size,0,Math.PI*2); ctx.fill();
    if(b.size&gt;4){ctx.fillStyle=b.color.replace(&#x27;)&#x27;,&#x27;,0.3)&#x27;).replace(&#x27;rgb&#x27;,&#x27;rgba&#x27;);ctx.beginPath();ctx.arc(sx,sy,b.size*2,0,Math.PI*2);ctx.fill();}
  });

  // ── PARTIKÜLLER ──
  particles.forEach(p=&gt;{
    const sx=W/2+(p.x-plane.x)*.16;
    const sy=H*.52+(p.y-plane.y)*.12;
    const alpha=p.life/p.maxLife;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(sx,sy,p.size*alpha,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // ── PATLAMA HALKALARI ──
  explosions.forEach(e=&gt;{
    const sx=W/2+(e.x-plane.x)*.16;
    const sy=H*.52+(e.y-plane.y)*.12;
    const alpha=(e.life/e.maxLife)*.6;
    ctx.save();
    ctx.strokeStyle=`rgba(255,150,0,${alpha})`;
    ctx.lineWidth=3*alpha;
    ctx.beginPath(); ctx.arc(sx,sy,e.r,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=`rgba(255,100,0,${alpha*.3})`;
    ctx.beginPath(); ctx.arc(sx,sy,e.r*.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // ── ŞAHİN TC UÇAĞI ──
  drawPlane();

  // ── EGZOZ ALEVI ──
  if(plane.throttle&gt;15){
    const fl=plane.throttle/100;
    const ex=W/2-50, ey=H/2-20;
    const fg=ctx.createRadialGradient(ex,ey,0,ex,ey,22*fl);
    fg.addColorStop(0,&#x27;rgba(255,220,80,.95)&#x27;);
    fg.addColorStop(.3,&#x27;rgba(255,120,0,.7)&#x27;);
    fg.addColorStop(.7,&#x27;rgba(255,50,0,.3)&#x27;);
    fg.addColorStop(1,&#x27;rgba(255,0,0,0)&#x27;);
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.ellipse(ex,ey,22*fl,6*fl,0,0,Math.PI*2); ctx.fill();
  }

  // ── RADAR ──
  drawRadar();

  // ── YAPAY UFUK ──
  drawAH();

  // ── PUSULA ──
  drawCompass();

  // ── CROSSHAIR RENK ──
  const nearEnemy=getNearestEnemy();
  const xcolor=nearEnemy?&#x27;rgba(255,51,68,.9)&#x27;:&#x27;rgba(0,255,136,.7)&#x27;;
  const xcircle=nearEnemy?&#x27;rgba(255,51,68,.6)&#x27;:&#x27;rgba(0,255,136,.45)&#x27;;
  [&#x27;xl1&#x27;,&#x27;xl2&#x27;,&#x27;xl3&#x27;,&#x27;xl4&#x27;].forEach(id=&gt;{const el=document.getElementById(id);if(el)el.setAttribute(&#x27;stroke&#x27;,xcolor);});
  const xc=document.getElementById(&#x27;xc&#x27;); if(xc)xc.setAttribute(&#x27;stroke&#x27;,xcircle);
  const xdot=document.getElementById(&#x27;xdot&#x27;); if(xdot)xdot.setAttribute(&#x27;fill&#x27;,xcolor);
  const lk=document.getElementById(&#x27;lock-label&#x27;); if(lk)lk.style.display=nearEnemy?&#x27;block&#x27;:&#x27;none&#x27;;

  // ── SKOR ──
  document.getElementById(&#x27;h-score&#x27;).textContent=score;

  // ── MİNİ HARİTA ──
  drawMinimap();
}

function drawMinimap(){
  const mc=document.getElementById(&#x27;minimap-c&#x27;);
  if(!mc)return;
  const mx=mc.getContext(&#x27;2d&#x27;);
  const MW=100,MH=100,MCX=50,MCY=50,MSCALE=0.04;
  mx.fillStyle=&#x27;rgba(0,10,5,.9)&#x27;; mx.fillRect(0,0,MW,MH);
  // Izgara
  mx.strokeStyle=&#x27;rgba(0,255,136,.06)&#x27;; mx.lineWidth=1;
  for(let i=0;i&lt;MW;i+=20){mx.beginPath();mx.moveTo(i,0);mx.lineTo(i,MH);mx.stroke();}
  for(let i=0;i&lt;MH;i+=20){mx.beginPath();mx.moveTo(0,i);mx.lineTo(MW,i);mx.stroke();}
  // Düşmanlar
  enemies.forEach(e=&gt;{
    if(!e.alive)return;
    const ex=MCX+(e.x-plane.x)*MSCALE;
    const ey=MCY+(e.y-plane.y)*MSCALE;
    if(ex&lt;2||ex&gt;MW-2||ey&lt;2||ey&gt;MH-2)return;
    mx.fillStyle=&#x27;#ff3344&#x27;;
    mx.fillRect(ex-2,ey-2,5,5);
  });
  // Dost uçaklar
  friendlies.forEach(f=&gt;{
    if(!f.alive)return;
    const fx=MCX+(f.x-plane.x)*MSCALE;
    const fy=MCY+(f.y-plane.y)*MSCALE;
    if(fx&lt;2||fx&gt;MW-2||fy&lt;2||fy&gt;MH-2)return;
    mx.fillStyle=&#x27;#00ff88&#x27;;
    mx.fillRect(fx-2,fy-2,4,4);
  });
  // Kendim — merkez
  mx.fillStyle=&#x27;#ffffff&#x27;;
  mx.font=&#x27;10px sans-serif&#x27;; mx.textAlign=&#x27;center&#x27;; mx.textBaseline=&#x27;middle&#x27;;
  mx.fillText(&#x27;✈&#x27;,MCX,MCY);
  // Çerçeve
  mx.strokeStyle=&#x27;rgba(0,255,136,.3)&#x27;; mx.lineWidth=1;
  mx.strokeRect(.5,.5,MW-1,MH-1);
}

function drawPlane(){
  const cx=W/2, cy=H/2-18;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(plane.roll*.22);
  // Gövde gölgesi
  ctx.fillStyle=&#x27;rgba(0,0,0,.3)&#x27;;
  ctx.beginPath(); ctx.ellipse(2,3,32,8,0,0,Math.PI*2); ctx.fill();
  // Ana gövde
  const bodyG=ctx.createLinearGradient(-30,0,30,0);
  bodyG.addColorStop(0,&#x27;#555&#x27;); bodyG.addColorStop(.5,&#x27;#ccc&#x27;); bodyG.addColorStop(1,&#x27;#777&#x27;);
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.ellipse(0,0,32,7,0,0,Math.PI*2); ctx.fill();
  // Burun
  ctx.fillStyle=&#x27;#888&#x27;;
  ctx.beginPath(); ctx.moveTo(32,0); ctx.lineTo(48,-4); ctx.lineTo(48,4); ctx.closePath(); ctx.fill();
  // Kabin
  ctx.fillStyle=&#x27;rgba(100,200,255,.6)&#x27;;
  ctx.beginPath(); ctx.ellipse(14,-4,8,4,-.3,0,Math.PI*2); ctx.fill();
  // Sol kanat
  const wg=ctx.createLinearGradient(0,-6,0,-28);
  wg.addColorStop(0,&#x27;#aaa&#x27;); wg.addColorStop(1,&#x27;#888&#x27;);
  ctx.fillStyle=wg;
  ctx.beginPath(); ctx.moveTo(2,-6); ctx.lineTo(20,-26); ctx.lineTo(24,-24); ctx.lineTo(10,-4); ctx.closePath(); ctx.fill();
  // Sağ kanat
  ctx.beginPath(); ctx.moveTo(2,6); ctx.lineTo(20,26); ctx.lineTo(24,24); ctx.lineTo(10,4); ctx.closePath(); ctx.fill();
  // Sol yatay kuyruk
  ctx.fillStyle=&#x27;#888&#x27;;
  ctx.beginPath(); ctx.moveTo(-20,-3); ctx.lineTo(-9,-13); ctx.lineTo(-7,-11); ctx.lineTo(-18,-2); ctx.closePath(); ctx.fill();
  // Sağ yatay kuyruk
  ctx.beginPath(); ctx.moveTo(-20,3); ctx.lineTo(-9,13); ctx.lineTo(-7,11); ctx.lineTo(-18,2); ctx.closePath(); ctx.fill();
  // Dikey kuyruk
  ctx.fillStyle=&#x27;#777&#x27;;
  ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(-14,-16); ctx.lineTo(-10,-14); ctx.lineTo(-22,0); ctx.closePath(); ctx.fill();
  // Türk bayrağı — kuyrukta küçük rozet
  ctx.save();
  ctx.translate(-22, -8); // dikey kuyruk üstü
  // Küçük bayrak dikdörtgeni
  ctx.fillStyle=&#x27;rgba(227,10,23,.85)&#x27;;
  ctx.fillRect(0,-5,10,10);
  // Beyaz ay
  ctx.fillStyle=&#x27;rgba(255,255,255,.9)&#x27;;
  ctx.beginPath(); ctx.arc(4,0,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=&#x27;rgba(227,10,23,.85)&#x27;;
  ctx.beginPath(); ctx.arc(5.2,0,2.1,0,Math.PI*2); ctx.fill();
  // Yıldız
  ctx.fillStyle=&#x27;rgba(255,255,255,.9)&#x27;;
  ctx.save(); ctx.translate(8,0); ctx.rotate(Math.PI/10);
  for(let i=0;i&lt;5;i++){
    ctx.rotate(Math.PI*2/5);
    ctx.beginPath(); ctx.moveTo(0,-1.8); ctx.lineTo(.5,-.5); ctx.lineTo(1.8,-.5);
    ctx.lineTo(.8,.5); ctx.lineTo(1.1,1.8); ctx.lineTo(0,1);
    ctx.lineTo(-1.1,1.8); ctx.lineTo(-.8,.5); ctx.lineTo(-1.8,-.5);
    ctx.lineTo(-.5,-.5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
  // Silah noktaları
  [-1,1].forEach(s=&gt;{
    ctx.fillStyle=&#x27;#555&#x27;;
    ctx.beginPath(); ctx.ellipse(8,s*14,6,2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#333&#x27;;
    ctx.fillRect(5,s*14-1,8,2);
  });
  ctx.restore();
}

function drawRadar(){
  const rx=66,ry=H-80,r=58;
  ctx.save();
  // Dış parlama
  ctx.fillStyle=&#x27;rgba(0,255,136,.04)&#x27;;
  ctx.beginPath(); ctx.arc(rx,ry,r+8,0,Math.PI*2); ctx.fill();
  // Arka plan
  ctx.fillStyle=&#x27;rgba(1,8,4,.9)&#x27;;
  ctx.beginPath(); ctx.arc(rx,ry,r,0,Math.PI*2); ctx.fill();
  // Tarama çizgileri
  ctx.strokeStyle=&#x27;rgba(0,255,136,.06)&#x27;; ctx.lineWidth=1;
  for(let i=0;i&lt;8;i++){
    const a=i*Math.PI/4;
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx+Math.cos(a)*r,ry+Math.sin(a)*r); ctx.stroke();
  }
  // Halkalar
  [.3,.6,1].forEach(s=&gt;{
    ctx.beginPath(); ctx.arc(rx,ry,r*s,0,Math.PI*2);
    ctx.strokeStyle=`rgba(0,255,136,${.08+s*.04})`; ctx.lineWidth=.8; ctx.stroke();
  });
  // Sweep
  ctx.save(); ctx.translate(rx,ry); ctx.rotate(radarSweep);
  const sg=ctx.createLinearGradient(0,0,r,0);
  sg.addColorStop(0,&#x27;rgba(0,255,136,.35)&#x27;); sg.addColorStop(.7,&#x27;rgba(0,255,136,.05)&#x27;); sg.addColorStop(1,&#x27;rgba(0,255,136,0)&#x27;);
  ctx.fillStyle=sg; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,-.6,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=&#x27;rgba(0,255,136,.6)&#x27;; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r,0); ctx.stroke();
  ctx.restore();
  // Hedefler
  enemies.forEach(e=&gt;{
    if(!e.alive)return;
    const dx=e.x-plane.x, dy=e.y-plane.y;
    const d=Math.sqrt(dx*dx+dy*dy); if(d&gt;2200)return;
    const a=Math.atan2(dy,dx)-plane.heading;
    const ex=rx+Math.cos(a)*(d/2200)*r;
    const ey2=ry+Math.sin(a)*(d/2200)*r;
    ctx.fillStyle=&#x27;#ff3344&#x27;;
    ctx.beginPath(); ctx.arc(ex,ey2,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;rgba(255,51,68,.2)&#x27;;
    ctx.beginPath(); ctx.arc(ex,ey2,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#ff5566&#x27;; ctx.font=&#x27;6px monospace&#x27;;
    ctx.fillText(e.id.slice(-2),ex+5,ey2-2);
  });
  // Dost uçaklar radarda
  friendlies.forEach(f=&gt;{
    if(!f.alive)return;
    const dx=f.x-plane.x,dy=f.y-plane.y;
    const d=Math.sqrt(dx*dx+dy*dy); if(d&gt;2200)return;
    const a=Math.atan2(dy,dx)-plane.heading;
    const fx=rx+Math.cos(a)*(d/2200)*r;
    const fy=ry+Math.sin(a)*(d/2200)*r;
    ctx.fillStyle=&#x27;#00ff88&#x27;;
    ctx.beginPath(); ctx.arc(fx,fy,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;rgba(0,255,136,.5)&#x27;; ctx.font=&#x27;6px monospace&#x27;;
    ctx.fillText(&#x27;F&#x27;,fx+4,fy-2);
  });

  // Kendi
  ctx.fillStyle=&#x27;#00ff88&#x27;; ctx.font=&#x27;bold 12px sans-serif&#x27;;
  ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;; ctx.fillText(&#x27;⊕&#x27;,rx,ry);
  ctx.textAlign=&#x27;left&#x27;; ctx.textBaseline=&#x27;alphabetic&#x27;;
  // Çerçeve
  ctx.strokeStyle=&#x27;rgba(0,255,136,.25)&#x27;; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(rx,ry,r,0,Math.PI*2); ctx.stroke();
  // Etiket
  ctx.fillStyle=&#x27;rgba(0,255,136,.35)&#x27;; ctx.font=&#x27;7px Share Tech Mono&#x27;;
  ctx.textAlign=&#x27;center&#x27;; ctx.fillText(&#x27;RADAR // &#x27;+radarModes[rmi],rx,ry+r+12);
  ctx.restore();
}

function drawAH(){
  const ax=160,ay=H-80,aw=74,ah=74;
  ctx.save();
  ctx.beginPath(); ctx.arc(ax,ay,aw/2+2,0,Math.PI*2); ctx.fillStyle=&#x27;rgba(0,0,0,.8)&#x27;; ctx.fill();
  ctx.beginPath(); ctx.rect(ax-aw/2,ay-ah/2,aw,ah); ctx.clip();
  ctx.save(); ctx.translate(ax,ay); ctx.rotate(-plane.roll*.28);
  const po=plane.pitch*28;
  ctx.fillStyle=&#x27;#0d2a4a&#x27;; ctx.fillRect(-aw,po-ah,aw*2,ah);
  ctx.fillStyle=&#x27;#1e3d0a&#x27;; ctx.fillRect(-aw,po,aw*2,ah);
  // Pitch lines
  for(let i=-2;i&lt;=2;i++){
    if(i===0)continue;
    const yy=po+i*12;
    ctx.strokeStyle=&#x27;rgba(255,255,255,.3)&#x27;; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(-15,yy); ctx.lineTo(15,yy); ctx.stroke();
    ctx.fillStyle=&#x27;rgba(255,255,255,.4)&#x27;; ctx.font=&#x27;6px monospace&#x27;; ctx.textAlign=&#x27;right&#x27;;
    ctx.fillText(Math.abs(i*10),-16,yy+2);
  }
  ctx.strokeStyle=&#x27;rgba(255,255,255,.6)&#x27;; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(-aw,po); ctx.lineTo(aw,po); ctx.stroke();
  ctx.restore();
  // Merkez imleci
  ctx.strokeStyle=&#x27;#ffcc00&#x27;; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(ax-24,ay); ctx.lineTo(ax-10,ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax+10,ay); ctx.lineTo(ax+24,ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax,ay-5); ctx.lineTo(ax,ay+5); ctx.stroke();
  // Çerçeve
  ctx.strokeStyle=&#x27;rgba(0,255,136,.3)&#x27;; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(ax,ay,aw/2+2,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=&#x27;rgba(0,255,136,.3)&#x27;; ctx.font=&#x27;7px Share Tech Mono&#x27;;
  ctx.textAlign=&#x27;center&#x27;; ctx.fillText(&#x27;YAPAY UFUK&#x27;,ax,ay+ah/2+14);
  ctx.restore();
}

function drawCompass(){
  const cx=W/2, cy=H-30;
  ctx.save();
  ctx.fillStyle=&#x27;rgba(0,0,0,.6)&#x27;; ctx.fillRect(cx-60,cy-10,120,20); ctx.strokeStyle=&#x27;rgba(0,255,136,.2)&#x27;; ctx.lineWidth=1; ctx.strokeRect(cx-60,cy-10,120,20);
  const headingDeg=((plane.heading*180/Math.PI)%360+360)%360;
  const dirs=[&#x27;N&#x27;,&#x27;NE&#x27;,&#x27;E&#x27;,&#x27;SE&#x27;,&#x27;S&#x27;,&#x27;SW&#x27;,&#x27;W&#x27;,&#x27;NW&#x27;,&#x27;N&#x27;];
  for(let i=-60;i&lt;=60;i+=5){
    const deg=(headingDeg+i+360)%360;
    const x=cx+i*1.5;
    ctx.strokeStyle=`rgba(0,255,136,${i===0?&#x27;.7&#x27;:&#x27;.2&#x27;})`; ctx.lineWidth=i===0?2:1;
    ctx.beginPath(); ctx.moveTo(x,cy-10); ctx.lineTo(x,cy-(i%10===0?7:4)); ctx.stroke();
    if(i%20===0){
      const di=Math.round(deg/45)%8;
      ctx.fillStyle=dirs[di]===&#x27;N&#x27;?&#x27;#ff3344&#x27;:&#x27;rgba(0,255,136,.6)&#x27;;
      ctx.font=&#x27;8px Orbitron&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillText(dirs[di],x,cy+6);
    }
  }
  ctx.fillStyle=&#x27;#00ff88&#x27;; ctx.font=&#x27;bold 8px Orbitron&#x27;; ctx.textAlign=&#x27;center&#x27;;
  ctx.fillText(Math.round(headingDeg)+&#x27;°&#x27;,cx,cy-1);
  ctx.restore();
}

function updateHUD(){
  document.getElementById(&#x27;h-alt&#x27;).textContent=Math.round(plane.alt).toLocaleString(&#x27;tr&#x27;);
  document.getElementById(&#x27;h-spd&#x27;).textContent=Math.round(plane.speed*35)+&#x27;km/h&#x27;;
  document.getElementById(&#x27;h-g&#x27;).textContent=plane.gForce.toFixed(1);
  document.getElementById(&#x27;h-fuel&#x27;).textContent=Math.round(plane.fuel);
  document.getElementById(&#x27;h-armor&#x27;).textContent=Math.round(plane.armor)+&#x27;%&#x27;;
  document.getElementById(&#x27;h-eng&#x27;).textContent=Math.round(plane.throttle)+&#x27;%&#x27;;
  document.getElementById(&#x27;armor-bar&#x27;).style.width=plane.armor+&#x27;%&#x27;;
  document.getElementById(&#x27;armor-bar&#x27;).style.background=plane.armor&gt;60?&#x27;#00ff88&#x27;:plane.armor&gt;30?&#x27;#ffcc00&#x27;:&#x27;#ff3344&#x27;;
  document.getElementById(&#x27;eng-bar&#x27;).style.width=plane.throttle+&#x27;%&#x27;;

  // Ekran kenarında düşman yön okları
  drawEnemyArrows();
}

function drawEnemyArrows(){
  // Canvas üzerinde değil, HUD canvas&#x27;ı kullan
  let arrowCanvas=document.getElementById(&#x27;arrow-cv&#x27;);
  if(!arrowCanvas){
    arrowCanvas=document.createElement(&#x27;canvas&#x27;);
    arrowCanvas.id=&#x27;arrow-cv&#x27;;
    arrowCanvas.style.cssText=&#x27;position:fixed;top:0;left:0;pointer-events:none;z-index:15;&#x27;;
    document.body.appendChild(arrowCanvas);
  }
  arrowCanvas.width=W; arrowCanvas.height=H;
  const ac=arrowCanvas.getContext(&#x27;2d&#x27;);
  ac.clearRect(0,0,W,H);

  const margin=50;
  enemies.forEach(e=&gt;{
    if(!e.alive)return;
    const sx=W/2+(e.x-plane.x)*.16;
    const sy=H*.52+(e.y-plane.y)*.12;
    // Ekran içindeyse ok çizme
    if(sx&gt;margin&amp;&amp;sx&lt;W-margin&amp;&amp;sy&gt;margin&amp;&amp;sy&lt;H-margin)return;
    // Yön hesapla
    const angle=Math.atan2(e.y-plane.y,e.x-plane.x);
    // Ok pozisyonu — ekran kenarında
    const cx=W/2, cy=H/2;
    const edgeX=Math.max(margin,Math.min(W-margin,cx+Math.cos(angle)*220));
    const edgeY=Math.max(margin+44,Math.min(H-margin-140,cy+Math.sin(angle)*280));
    const dist=Math.round(Math.sqrt((e.x-plane.x)**2+(e.y-plane.y)**2)/10);
    // Ok çiz
    ac.save(); ac.translate(edgeX,edgeY); ac.rotate(angle);
    ac.fillStyle=&#x27;rgba(255,51,68,.85)&#x27;;
    ac.beginPath(); ac.moveTo(14,0); ac.lineTo(-6,-7); ac.lineTo(-3,0); ac.lineTo(-6,7); ac.closePath(); ac.fill();
    ac.strokeStyle=&#x27;rgba(255,51,68,.4)&#x27;; ac.lineWidth=1;
    ac.strokeRect(-6,-7,20,14);
    ac.restore();
    // Mesafe + ID
    ac.fillStyle=&#x27;rgba(255,51,68,.8)&#x27;; ac.font=&#x27;8px Share Tech Mono&#x27;;
    ac.textAlign=&#x27;center&#x27;; ac.fillText(e.id+&#x27;  &#x27;+dist+&#x27;km&#x27;,edgeX,edgeY+16);
  });
}

function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-last)/1000,.05); last=ts;
  if(dt&lt;.001)return;
  update(dt);
  draw();
  updateHUD();
}

function startGame(diff){
  difficulty=diff;
  gameStats={kills:0,friendlyFire:0,wavesCleared:0,shotsFired:0,startTime:Date.now()};
  document.getElementById(&#x27;briefing&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;hud&#x27;).style.display=&#x27;block&#x27;;
  document.getElementById(&#x27;minimap-wrap&#x27;).style.display=&#x27;block&#x27;;
  spawnEnemies();
  renderMissions();
}

function init(){
  resize();
  initStars();
  initTerrain();
  applyLang();
  // Briefing ekranını göster, HUD gizle
  document.getElementById(&#x27;hud&#x27;).style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;briefing&#x27;).style.display=&#x27;flex&#x27;;
  requestAnimationFrame(loop);
}

body::after {
  content: &#x27;&#x27;;
  position: fixed; inset: 0;
  background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox=&#x27;0 0 256 256&#x27; xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%3E%3Cfilter id=&#x27;noise&#x27;%3E%3CfeTurbulence type=&#x27;fractalNoise&#x27; baseFrequency=&#x27;0.9&#x27; numOctaves=&#x27;4&#x27; stitchTiles=&#x27;stitch&#x27;/%3E%3C/filter%3E%3Crect width=&#x27;100%25&#x27; height=&#x27;100%25&#x27; filter=&#x27;url(%23noise)&#x27; opacity=&#x27;0.04&#x27;/%3E%3C/svg%3E&quot;);
  pointer-events: none; z-index: 9999;
  opacity: .6;
}

/* ══ SCREENS ══ */
.screen { display: none; }
.screen.active { display: block; }

/* ══════════════════════════════════
   COVER PAGE
══════════════════════════════════ */
#screenCover {
  min-height: 100vh;
  display: flex; flex-direction: column;
}

.cover-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px;
  border-bottom: 2px solid var(--ink);
}
.cover-header-left {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-faded);
}
.mag-title {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 28px; font-weight: 900; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink);
}
.cover-header-right {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 11px; letter-spacing: .12em;
  color: var(--ink-faded); text-align: right;
}

.cover-body {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  position: relative;
}

.cover-left {
  padding: 64px 48px 80px;
  border-right: 1px solid var(--border-dark);
  display: flex; flex-direction: column; justify-content: space-between;
}

.cover-eyebrow {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
  color: var(--red);
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 12px;
}
.cover-eyebrow::before {
  content: &#x27;&#x27;; display: block;
  width: 32px; height: 1px; background: var(--red);
}

.cover-headline {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: clamp(52px, 7vw, 88px);
  font-weight: 900;
  line-height: .95;
  color: var(--ink);
  margin-bottom: 40px;
  letter-spacing: -.02em;
}
.cover-headline em {
  font-style: italic;
  color: var(--red);
}

.cover-dek {
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 17px; font-style: italic;
  color: var(--ink-light);
  line-height: 1.7;
  max-width: 340px;
  margin-bottom: 48px;
  border-left: 3px solid var(--gold);
  padding-left: 20px;
}

.cover-meta-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0;
  border-top: 1px solid var(--border);
  border-left: 1px solid var(--border);
}
.cover-meta-item {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.cover-meta-label {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-ghost); margin-bottom: 4px;
}
.cover-meta-val {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 18px; font-weight: 700; color: var(--ink);
}

.cover-right {
  display: flex; flex-direction: column;
  padding: 64px 48px 80px;
}

.contents-title {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-faded); margin-bottom: 28px;
}
.contents-list {
  flex: 1;
}
.contents-item {
  display: flex; align-items: baseline;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all .2s;
}
.contents-item:hover .contents-item-name { color: var(--red); }
.contents-item-num {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; color: var(--ink-ghost); min-width: 28px;
}
.contents-item-name {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 16px; flex: 1;
  transition: color .2s;
}
.contents-item-scale {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-ghost);
}

.cover-start-bar {
  margin-top: 40px;
  padding-top: 32px;
  border-top: 2px solid var(--ink);
}
.btn-start-mag {
  width: 100%;
  background: var(--ink);
  color: var(--cream);
  border: none; cursor: pointer;
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 18px; font-weight: 700;
  letter-spacing: .04em;
  padding: 20px 32px;
  display: flex; align-items: center; justify-content: space-between;
  transition: all .25s;
}
.btn-start-mag:hover {
  background: var(--red);
  letter-spacing: .08em;
}
.btn-start-mag span {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 20px;
}

.cover-footer {
  padding: 18px 48px;
  border-top: 2px solid var(--ink);
  display: flex; justify-content: space-between; align-items: center;
}
.cover-footer-text {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-faded);
}
.issn {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; color: var(--ink-ghost); letter-spacing: .1em;
}

/* ══════════════════════════════════
   SECTION DIVIDER
══════════════════════════════════ */
.section-divider {
  min-height: 100vh;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 80px 80px;
  position: relative;
  overflow: hidden;
  background: var(--ink);
}

.divider-number {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: clamp(160px, 22vw, 280px);
  font-weight: 900; font-style: italic;
  color: rgba(255,255,255,.04);
  position: absolute; right: -20px; top: 50%;
  transform: translateY(-50%);
  line-height: 1; pointer-events: none;
  user-select: none;
}

.divider-eyebrow {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
  color: var(--gold-light); margin-bottom: 24px;
  display: flex; align-items: center; gap: 16px;
}
.divider-eyebrow::before {
  content: &#x27;&#x27;; display: block;
  width: 48px; height: 1px; background: var(--gold-light);
}

.divider-title {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: clamp(42px, 6vw, 72px);
  font-weight: 900; font-style: italic;
  color: var(--cream);
  line-height: 1.1; margin-bottom: 32px;
  max-width: 600px;
}

.divider-desc {
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 18px; color: rgba(245,240,232,.55);
  line-height: 1.8; max-width: 480px;
  margin-bottom: 48px;
}

.divider-rule {
  width: 80px; height: 2px;
  background: var(--gold-light);
  margin-bottom: 32px;
}

.divider-count {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(245,240,232,.4);
}

/* ══════════════════════════════════
   QUESTION PAGE
══════════════════════════════════ */
#screenQuestion { background: var(--ivory); }

.q-top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--cream);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; height: 52px;
}
.q-top-mag {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 14px; font-weight: 900; letter-spacing: .06em;
  text-transform: uppercase;
}
.q-top-progress {
  display: flex; align-items: center; gap: 16px;
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 11px; color: var(--ink-faded);
  letter-spacing: .1em;
}
.q-prog-bar {
  width: 180px; height: 2px;
  background: var(--border);
  position: relative;
}
.q-prog-fill {
  height: 100%;
  background: var(--red);
  transition: width .4s ease;
}
.q-top-section-name {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-faded);
}

.q-page {
  min-height: 100vh;
  padding: 100px 0 60px;
  display: grid;
  grid-template-columns: 200px 1fr 200px;
}

.q-margin-left {
  padding: 40px 24px;
  border-right: 1px solid var(--border);
}
.margin-num {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 64px; font-weight: 900; font-style: italic;
  color: var(--border);
  line-height: 1;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
}
.margin-scale-tag {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-ghost);
  writing-mode: vertical-rl; transform: rotate(180deg);
  margin-top: 20px;
}

.q-center {
  padding: 60px 80px;
  max-width: 780px; margin: 0 auto;
  width: 100%;
}

.q-rubric {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 40px;
}
.q-id-tag {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .18em;
  color: var(--ink-ghost); text-transform: uppercase;
  border: 1px solid var(--border);
  padding: 4px 10px;
}
.q-section-pill {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  padding: 4px 12px;
  border: 1px solid;
}

.question-text {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: clamp(22px, 3.5vw, 34px);
  font-weight: 400; font-style: italic;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 12px;
  position: relative;
  padding-left: 36px;
}
.question-text::before {
  content: &#x27;\201C&#x27;;
  font-size: 80px; line-height: 0;
  color: var(--border);
  position: absolute; left: -8px; top: 36px;
  font-family: &#x27;Playfair Display&#x27;, serif;
}

.q-divider-line {
  width: 60px; height: 1px;
  background: var(--gold);
  margin: 32px 0 40px 36px;
}

/* LIKERT — editorial style */
.likert-editorial {
  margin: 0 0 48px 36px;
}
.likert-scale-labels {
  display: flex; justify-content: space-between;
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 12px; font-style: italic;
  color: var(--ink-faded);
  margin-bottom: 14px;
}
.likert-buttons {
  display: flex; gap: 2px;
}
.lbtn {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  padding: 20px 8px;
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 20px; font-weight: 700;
  color: var(--ink-ghost);
  cursor: pointer;
  transition: all .15s;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.lbtn::after {
  content: &#x27;&#x27;;
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background: var(--red);
  transform: scaleX(0); transform-origin: center;
  transition: transform .2s;
}
.lbtn:hover { border-color: var(--ink-faded); color: var(--ink); }
.lbtn:hover::after { transform: scaleX(1); }
.lbtn.selected {
  background: var(--ink); color: var(--cream);
  border-color: var(--ink);
}
.lbtn.selected::after { transform: scaleX(1); background: var(--red); }

/* T/F editorial */
.tf-editorial {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px; margin: 0 0 48px 36px;
}
.tfbtn {
  border: 1px solid var(--border);
  background: none;
  padding: 28px 24px;
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 18px; font-weight: 700;
  color: var(--ink-faded);
  cursor: pointer;
  transition: all .2s;
  display: flex; align-items: center; gap: 14px;
  position: relative; overflow: hidden;
}
.tfbtn::before {
  content: &#x27;&#x27;;
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--red);
  transform: scaleY(0); transform-origin: bottom;
  transition: transform .2s;
}
.tfbtn:hover { border-color: var(--ink); color: var(--ink); }
.tfbtn:hover::before { transform: scaleY(1); }
.tfbtn.sel-true { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.tfbtn.sel-true::before { transform: scaleY(1); background: var(--gold); }
.tfbtn.sel-false { border-color: var(--red-dark); color: var(--red-dark); }
.tfbtn.sel-false::before { transform: scaleY(1); }
.tfbtn-icon { font-size: 24px; line-height: 1; }

/* NAV */
.q-nav-editorial {
  display: flex; align-items: center; gap: 0;
  margin-left: 36px;
  border-top: 1px solid var(--border);
  padding-top: 24px;
}
.navbtn {
  padding: 14px 28px;
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 15px; letter-spacing: .04em;
  border: none; background: none;
  color: var(--ink-faded); cursor: pointer;
  border: 1px solid var(--border);
  transition: all .15s;
}
.navbtn:hover { border-color: var(--ink); color: var(--ink); }
.navbtn-next {
  background: var(--ink); color: var(--cream);
  border-color: var(--ink);
  margin-left: 2px;
}
.navbtn-next:hover { background: var(--red); border-color: var(--red); }
.navbtn-next:disabled { opacity: .3; cursor: not-allowed; }
.navbtn-next:disabled:hover { background: var(--ink); border-color: var(--ink); }
.skip-link {
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 13px; font-style: italic;
  color: var(--ink-ghost); background: none;
  border: none; cursor: pointer; margin-left: 16px;
  text-decoration: underline; text-underline-offset: 3px;
  transition: color .15s;
}
.skip-link:hover { color: var(--ink-faded); }

.q-margin-right {
  padding: 40px 24px;
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  gap: 32px;
}
.scale-mini-list { width: 100%; }
.scale-mini-item {
  margin-bottom: 10px;
}
.scale-mini-label {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 8px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-ghost); margin-bottom: 3px;
  display: flex; justify-content: space-between;
}
.scale-mini-bar {
  height: 2px; background: var(--border);
}
.scale-mini-fill {
  height: 100%; background: var(--red);
  transition: width .3s;
}

/* ══════════════════════════════════
   RESULTS — MAGAZINE SPREAD
══════════════════════════════════ */
#screenResults { background: var(--ivory); }

.results-cover {
  min-height: 60vh;
  background: var(--ink);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 80px;
  position: relative; overflow: hidden;
}
.results-cover-bg-text {
  position: absolute;
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 280px; font-weight: 900; font-style: italic;
  color: rgba(255,255,255,.03);
  right: -40px; top: 50%; transform: translateY(-50%);
  pointer-events: none; user-select: none;
  white-space: nowrap;
}
.results-cover-eyebrow {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
  color: var(--gold-light); margin-bottom: 20px;
  display: flex; align-items: center; gap: 16px;
}
.results-cover-eyebrow::before {
  content: &#x27;&#x27;; display: block; width: 48px; height: 1px; background: var(--gold-light);
}
.results-cover-title {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: clamp(44px, 6vw, 80px);
  font-weight: 900; color: var(--cream);
  line-height: 1; margin-bottom: 12px;
}
.results-cover-sub {
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 16px; font-style: italic;
  color: rgba(245,240,232,.5);
}

/* Validity strip */
.validity-strip {
  background: var(--cream);
  border-bottom: 2px solid var(--ink);
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.val-cell {
  padding: 28px 32px;
  border-right: 1px solid var(--border);
}
.val-cell:last-child { border-right: none; }
.val-cell-label {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-ghost); margin-bottom: 8px;
}
.val-cell-num {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 40px; font-weight: 700;
  color: var(--ink); line-height: 1; margin-bottom: 4px;
}
.val-cell-status {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .1em;
  display: inline-block; padding: 2px 8px;
}
.vstatus-ok { background: rgba(184,134,11,.12); color: var(--gold); }
.vstatus-warn { background: rgba(192,57,43,.1); color: var(--red); }

/* Profile summary spread */
.profile-spread {
  display: grid; grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--border);
}
.profile-summary-col {
  padding: 64px 64px;
  border-right: 1px solid var(--border);
}
.profile-summary-col-title {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 11px; font-weight: 700; letter-spacing: .22em;
  text-transform: uppercase; color: var(--red);
  margin-bottom: 28px;
  display: flex; align-items: center; gap: 12px;
}
.profile-summary-col-title::after {
  content: &#x27;&#x27;; flex: 1; height: 1px; background: var(--border);
}
.profile-summary-text {
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 17px; line-height: 1.8; color: var(--ink-light);
}
.profile-pullquote {
  padding: 64px 64px;
  display: flex; flex-direction: column; justify-content: center;
}
.pullquote-mark {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 80px; line-height: 1;
  color: var(--border); display: block;
  margin-bottom: -12px;
}
.pullquote-text {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: clamp(20px, 2.5vw, 28px);
  font-style: italic;
  line-height: 1.5; color: var(--ink);
  margin-bottom: 20px;
}
.pullquote-attr {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-ghost);
}

/* Scale cards — editorial grid */
.scale-spread-title {
  padding: 48px 64px 24px;
  display: flex; align-items: baseline; gap: 24px;
  border-bottom: 1px solid var(--border);
}
.sst-main {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 32px; font-weight: 700; letter-spacing: -.01em;
}
.sst-sub {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-faded);
}

.scale-editorial-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  border-left: 1px solid var(--border);
}
.scale-ed-card {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 36px 40px;
  position: relative;
  overflow: hidden;
}
.scale-ed-card::before {
  content: attr(data-scale);
  position: absolute; right: 24px; top: 20px;
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 72px; font-weight: 900; font-style: italic;
  color: rgba(26,22,18,.04);
  line-height: 1; pointer-events: none; user-select: none;
}
.scale-ed-label {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-ghost); margin-bottom: 8px;
}
.scale-ed-name {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 20px; font-weight: 700;
  color: var(--ink); margin-bottom: 20px;
}
.scale-ed-score-row {
  display: flex; align-items: flex-end; gap: 4px;
  margin-bottom: 12px;
}
.scale-ed-num {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 56px; font-weight: 900; line-height: 1;
  color: var(--ink);
}
.scale-ed-unit {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 12px; color: var(--ink-ghost);
  margin-bottom: 8px;
}
.scale-ed-ruler {
  height: 3px; background: var(--border); margin-bottom: 14px;
  position: relative;
}
.scale-ed-ruler-fill {
  height: 100%; background: var(--red);
  transition: width 1.2s cubic-bezier(.23,1,.32,1);
}
.scale-ed-ruler-marker {
  position: absolute; top: -4px;
  width: 1px; height: 11px;
  background: var(--gold);
}
.scale-ed-band {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  display: inline-block; padding: 3px 10px;
  margin-bottom: 12px;
}
.band-low { background: rgba(184,134,11,.1); color: var(--gold); border: 1px solid rgba(184,134,11,.3); }
.band-avg { background: rgba(26,22,18,.06); color: var(--ink-faded); border: 1px solid var(--border); }
.band-high { background: rgba(192,57,43,.08); color: var(--red); border: 1px solid rgba(192,57,43,.2); }

.scale-ed-desc {
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 13px; line-height: 1.6; color: var(--ink-faded);
}

/* Results footer */
.results-footer {
  padding: 48px 64px;
  border-top: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: space-between;
}
.btn-restart-mag {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 16px; letter-spacing: .04em;
  padding: 16px 36px;
  border: 1px solid var(--ink);
  background: none;
  color: var(--ink); cursor: pointer;
  transition: all .2s;
}
.btn-restart-mag:hover { background: var(--ink); color: var(--cream); }
.results-footer-note {
  font-family: &#x27;Cormorant Garamond&#x27;, serif;
  font-size: 13px; font-style: italic;
  color: var(--ink-ghost);
  max-width: 400px; text-align: right;
}

/* Loading */
#screenLoading {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; gap: 24px;
  background: var(--ink);
}
.loading-title {
  font-family: &#x27;Playfair Display&#x27;, serif;
  font-size: 28px; font-style: italic;
  color: var(--cream); letter-spacing: .04em;
}
.loading-sub {
  font-family: &#x27;Courier Prime&#x27;, monospace;
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--gold-light);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
.loading-bar {
  width: 240px; height: 1px; background: rgba(245,240,232,.15);
}
.loading-fill {
  height: 100%; background: var(--gold-light);
  animation: loadFill 2s ease-in-out forwards;
}
@keyframes loadFill { from{width:0%} to{width:100%} }

/* Animations */
@keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.q-center { animation: fadeIn .35s ease; }
.results-cover { animation: fadeIn .5s ease; }

@media (max-width: 900px) {
  .cover-body { grid-template-columns: 1fr; }
  .cover-left { border-right: none; border-bottom: 1px solid var(--border-dark); }
  .q-page { grid-template-columns: 1fr; }
  .q-margin-left, .q-margin-right { display: none; }
  .q-center { padding: 40px 24px; }
  .question-text { padding-left: 0; font-size: 22px; }
  .question-text::before { display: none; }
  .q-divider-line, .likert-editorial, .tf-editorial, .q-nav-editorial { margin-left: 0; }
  .profile-spread { grid-template-columns: 1fr; }
  .scale-editorial-grid { grid-template-columns: 1fr; }
  .cover-header { padding: 20px 24px; }
  .cover-left, .cover-right { padding: 40px 24px; }
  .results-cover { padding: 48px 24px; }
  .validity-strip { grid-template-columns: repeat(2,1fr); }
  .profile-summary-col, .profile-pullquote { padding: 40px 24px; }
  .scale-spread-title, .results-footer { padding: 32px 24px; }
  .scale-ed-card { padding: 28px 24px; }
  .section-divider { padding: 48px 24px; }
}

let currentQ=0, answers={}, skipped=new Set();

function startTest(){
  showScreen(&#x27;screenQuestion&#x27;);

}

function showScreen(id){
  document.querySelectorAll(&#x27;.screen&#x27;).forEach(s=&gt;s.classList.remove(&#x27;active&#x27;));
  document.getElementById(id).classList.add(&#x27;active&#x27;);
}

function buildMiniList(){
  const el=document.getElementById(&#x27;scaleMiniList&#x27;);
  el.innerHTML=Object.keys(SCALES).map(k=&gt;`
    &lt;div class=&quot;scale-mini-item&quot;&gt;
      &lt;div class=&quot;scale-mini-label&quot;&gt;
        &lt;span style=&quot;color:${SCALE_COLORS[k]}&quot;&gt;${SCALES[k].abbr}&lt;/span&gt;
        &lt;span id=&quot;mpct_${k}&quot;&gt;0%&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;scale-mini-bar&quot;&gt;
        &lt;div class=&quot;scale-mini-fill&quot; id=&quot;mfill_${k}&quot; style=&quot;width:0%;background:${SCALE_COLORS[k]}&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;);
}

function updateMiniList(){
  Object.keys(SCALES).forEach(k=&gt;{
    const qs=ALL_QUESTIONS.filter(q=&gt;q.scale===k);
    const pct=Math.round(qs.filter(q=&gt;answers[q.id]!==undefined).length/qs.length*100);
    const f=document.getElementById(&#x27;mfill_&#x27;+k);
    const p=document.getElementById(&#x27;mpct_&#x27;+k);
    if(f)f.style.width=pct+&#x27;%&#x27;;
    if(p)p.textContent=pct+&#x27;%&#x27;;
  });
}

function renderQ(){
  const q=ALL_QUESTIONS[currentQ];
  const pct=((currentQ+1)/ALL_QUESTIONS.length*100).toFixed(1);
  const c=SCALE_COLORS[q.scale];
  const sname=SCALES[q.scale].name;

  document.getElementById(&#x27;qProgFill&#x27;).style.width=pct+&#x27;%&#x27;;
  document.getElementById(&#x27;topQNum&#x27;).textContent=(currentQ+1)+&#x27; / 200&#x27;;
  document.getElementById(&#x27;topSectionName&#x27;).textContent=sname;
  document.getElementById(&#x27;marginNum&#x27;).textContent=String(q.id).padStart(3,&#x27;0&#x27;);
  document.getElementById(&#x27;marginScale&#x27;).textContent=q.scale;
  document.getElementById(&#x27;qIdTag&#x27;).textContent=&#x27;S-&#x27;+String(q.id).padStart(3,&#x27;0&#x27;);

  const pill=document.getElementById(&#x27;qSectionPill&#x27;);
  pill.textContent=sname;
  pill.style.color=c; pill.style.borderColor=c;

  document.getElementById(&#x27;qText&#x27;).textContent=q.text;

  const le=document.getElementById(&#x27;likertEditorial&#x27;);
  const te=document.getElementById(&#x27;tfEditorial&#x27;);

  if(q.type===&#x27;tf&#x27;){
    le.style.display=&#x27;none&#x27;; te.style.display=&#x27;grid&#x27;;
    document.getElementById(&#x27;tfTrue&#x27;).className=&#x27;tfbtn&#x27;+(answers[q.id]===1?&#x27; sel-true&#x27;:&#x27;&#x27;);
    document.getElementById(&#x27;tfFalse&#x27;).className=&#x27;tfbtn&#x27;+(answers[q.id]===0?&#x27; sel-false&#x27;:&#x27;&#x27;);
  } else {
    te.style.display=&#x27;none&#x27;; le.style.display=&#x27;block&#x27;;
    document.querySelectorAll(&#x27;.lbtn&#x27;).forEach(b=&gt;{
      b.classList.toggle(&#x27;selected&#x27;, answers[q.id]===parseInt(b.dataset.val));
    });
  }

  document.getElementById(&#x27;btnNext&#x27;).disabled=answers[q.id]===undefined;
  updateMiniList();
}

function selectLikert(v){
  const q=ALL_QUESTIONS[currentQ];
  answers[q.id]=v;
  document.querySelectorAll(&#x27;.lbtn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;selected&#x27;));
  document.querySelector(`.lbtn[data-val=&quot;${v}&quot;]`).classList.add(&#x27;selected&#x27;);
  document.getElementById(&#x27;btnNext&#x27;).disabled=false;
  setTimeout(()=&gt;nextQ(),360);
}

function selectTF(val){
  const q=ALL_QUESTIONS[currentQ];
  answers[q.id]=val?1:0;
  document.getElementById(&#x27;tfTrue&#x27;).className=&#x27;tfbtn&#x27;+(val?&#x27; sel-true&#x27;:&#x27;&#x27;);
  document.getElementById(&#x27;tfFalse&#x27;).className=&#x27;tfbtn&#x27;+(val?&#x27;&#x27;:&#x27; sel-false&#x27;);
  document.getElementById(&#x27;btnNext&#x27;).disabled=false;
  setTimeout(()=&gt;nextQ(),360);
}

function nextQ(){
  if(currentQ&lt;ALL_QUESTIONS.length-1){currentQ++;renderQ();}
  else finishTest();
}
function prevQ(){if(currentQ&gt;0){currentQ--;renderQ();}}
function skipQ(){skipped.add(ALL_QUESTIONS[currentQ].id);nextQ();}

function finishTest(){
  showScreen(&#x27;screenLoading&#x27;);
  setTimeout(()=&gt;{
    const scores=calcScores();
    const val=calcValidity();
    renderResults(scores,val);
    showScreen(&#x27;screenResults&#x27;);
    setTimeout(()=&gt;{
      document.querySelectorAll(&#x27;.scale-ed-ruler-fill&#x27;).forEach(el=&gt;{
        el.style.width=el.dataset.w+&#x27;%&#x27;;
      });
    },150);
  },2400);
}

function calcScores(){
  const tot={},mx={};
  ALL_QUESTIONS.forEach(q=&gt;{
    if(!tot[q.scale]){tot[q.scale]=0;mx[q.scale]=0;}
    const v=answers[q.id]; if(v===undefined)return;
    const max=q.type===&#x27;tf&#x27;?1:5;
    mx[q.scale]+=max;
    tot[q.scale]+= q.rev?(max+1-v):v;
  });
  return Object.keys(SCALES).map(k=&gt;({
    scale:k,
    raw:tot[k]||0,
    max:mx[k]||1,
    pct:Math.round(((tot[k]||0)/(mx[k]||1))*100),
  }));
}

function calcValidity(){
  const lArr=L_ITEMS.map(id=&gt;{
    const q=ALL_QUESTIONS.find(q=&gt;q.id===id);
    return q&amp;&amp;answers[id]!==undefined?(q.rev?answers[id]:(6-answers[id])):3;
  });
  const lAvg=Math.round(lArr.reduce((a,b)=&gt;a+b,0)/lArr.length);
  const fSum=F_ITEMS.filter(id=&gt;answers[id]!==undefined&amp;&amp;(answers[id]&gt;=4||answers[id]===1)).length;
  const kArr=K_ITEMS.map(id=&gt;{
    const q=ALL_QUESTIONS.find(q=&gt;q.id===id);
    return q&amp;&amp;answers[id]!==undefined?(q.rev?(6-answers[id]):answers[id]):3;
  });
  const kAvg=Math.round(kArr.reduce((a,b)=&gt;a+b,0)/kArr.length);
  return {L:lAvg,F:fSum,K:kAvg,skip:skipped.size};
}

function bandLabel(pct){
  if(pct&lt;35)return{label:&#x27;Düşük&#x27;,cls:&#x27;band-low&#x27;};
  if(pct&lt;65)return{label:&#x27;Ortalama&#x27;,cls:&#x27;band-avg&#x27;};
  return{label:&#x27;Yüksek&#x27;,cls:&#x27;band-high&#x27;};
}

function getSummary(scores){
  const high=scores.filter(s=&gt;s.pct&gt;=65).map(s=&gt;SCALES[s.scale].name);
  const low=scores.filter(s=&gt;s.pct&lt;35).map(s=&gt;SCALES[s.scale].name);
  if(!high.length&amp;&amp;!low.length)return&#x27;Profiliniz çoğunlukla ortalama aralıkta seyretmektedir. Bu durum duygusal denge ve genel psikolojik işlevsellik açısından dengeli bir tablo sunmaktadır. Herhangi bir boyutta belirgin bir örüntü saptanmamıştır.&#x27;;
  let t=&#x27;&#x27;;
  if(high.length)t+=`&lt;strong&gt;${high.join(&#x27;, &#x27;)}&lt;/strong&gt; ölçeklerinde yüksek puanlar dikkat çekmektedir. Bu boyutlar daha yakından incelenmeyi ve gerektiğinde profesyonel destek almayı değerlendirebileceğiniz alanlardır. `;
  if(low.length)t+=`&lt;strong&gt;${low.join(&#x27;, &#x27;)}&lt;/strong&gt; ölçeklerinde ise belirgin klinik özellik görülmemektedir.`;
  return t;
}

function getPullquote(scores){
  const top=scores.sort((a,b)=&gt;b.pct-a.pct)[0];
  const quotes={
    DEP:&#x27;Melankoli, ruhun kendi derinliğine yaptığı yolculuktur.&#x27;,
    ANX:&#x27;Kaygı, gelmesi muhtemel olmayan bir şeyi beklemenin bedenimizdeki yankısıdır.&#x27;,
    HYP:&#x27;Coşku bir enerji değil, bir ritimdir; ya seni taşır ya da savurur.&#x27;,
    PAR:&#x27;Güven, verilen değil kazanılan bir şeydir — peki kim önce uzanır?&#x27;,
    SCH:&#x27;Yalnızlık seçimle başlar, sonra bir dile dönüşür.&#x27;,
    PSY:&#x27;Empati bir zayıflık değil; toplumun en ince örülen ipliğidir.&#x27;,
    NEU:&#x27;Duygular bilgi taşır — önemli olan onları kim yönettiğidir.&#x27;,
    EXT:&#x27;Bağlantı, insanın en eski ve en keskin ihtiyacıdır.&#x27;,
    SOM:&#x27;Beden, zihnin söze dökemediği şeyleri sessizce anlatır.&#x27;,
    OCD:&#x27;Düzen arayışı, belirsizliğe verilen insani bir yanıttır.&#x27;,
  };
  return quotes[top?.scale]||&#x27;Zihin, kendini ancak kendi ölçütleriyle değerlendirebilir.&#x27;;
}

function vstatus(ok){return ok?&#x27;vstatus-ok&#x27;:&#x27;vstatus-warn&#x27;;}

function renderResults(scores,val){
  const d=new Date();
  document.getElementById(&#x27;resultsDate&#x27;).textContent=
    d.toLocaleDateString(&#x27;tr-TR&#x27;,{day:&#x27;numeric&#x27;,month:&#x27;long&#x27;,year:&#x27;numeric&#x27;})+
    &#x27; — &#x27;+d.toLocaleTimeString(&#x27;tr-TR&#x27;,{hour:&#x27;2-digit&#x27;,minute:&#x27;2-digit&#x27;});

  // Validity
  document.getElementById(&#x27;scaleL&#x27;).textContent=val.L;
  document.getElementById(&#x27;scaleF&#x27;).textContent=val.F;
  document.getElementById(&#x27;scaleK&#x27;).textContent=val.K;
  document.getElementById(&#x27;scaleSkip&#x27;).textContent=val.skip;
  const lOk=val.L&lt;=3,fOk=val.F&lt;=6,kOk=val.K&lt;=4,sOk=val.skip&lt;=30;
  document.getElementById(&#x27;scaleLStatus&#x27;).textContent=lOk?&#x27;Normal&#x27;:&#x27;Dikkat&#x27;;
  document.getElementById(&#x27;scaleLStatus&#x27;).className=&#x27;val-cell-status &#x27;+vstatus(lOk);
  document.getElementById(&#x27;scaleFStatus&#x27;).textContent=fOk?&#x27;Normal&#x27;:&#x27;Dikkat&#x27;;
  document.getElementById(&#x27;scaleFStatus&#x27;).className=&#x27;val-cell-status &#x27;+vstatus(fOk);
  document.getElementById(&#x27;scaleKStatus&#x27;).textContent=kOk?&#x27;Normal&#x27;:&#x27;Yüksek&#x27;;
  document.getElementById(&#x27;scaleKStatus&#x27;).className=&#x27;val-cell-status &#x27;+vstatus(kOk);
  document.getElementById(&#x27;scaleSkipStatus&#x27;).textContent=sOk?&#x27;Kabul Edilebilir&#x27;:&#x27;Fazla&#x27;;
  document.getElementById(&#x27;scaleSkipStatus&#x27;).className=&#x27;val-cell-status &#x27;+vstatus(sOk);

  document.getElementById(&#x27;profileText&#x27;).innerHTML=getSummary(scores);
  document.getElementById(&#x27;pullquoteText&#x27;).textContent=getPullquote([...scores]);

  // Scale grid
  const grid=document.getElementById(&#x27;scaleGrid&#x27;);
  grid.innerHTML=scores.map(s=&gt;{
    const info=SCALES[s.scale];
    const band=bandLabel(s.pct);
    const c=SCALE_COLORS[s.scale];
    return `&lt;div class=&quot;scale-ed-card&quot; data-scale=&quot;${info.roman}&quot;&gt;
      &lt;div class=&quot;scale-ed-label&quot;&gt;${info.abbr} · Ölçek ${info.roman}&lt;/div&gt;
      &lt;div class=&quot;scale-ed-name&quot;&gt;${info.name}&lt;/div&gt;
      &lt;div class=&quot;scale-ed-score-row&quot;&gt;
        &lt;div class=&quot;scale-ed-num&quot; style=&quot;color:${c}&quot;&gt;${s.pct}&lt;/div&gt;
        &lt;div class=&quot;scale-ed-unit&quot;&gt;/ 100&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;scale-ed-ruler&quot;&gt;
        &lt;div class=&quot;scale-ed-ruler-fill&quot; style=&quot;width:0%;background:${c}&quot; data-w=&quot;${s.pct}&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;scale-ed-ruler-marker&quot; style=&quot;left:50%&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;span class=&quot;scale-ed-band ${band.cls}&quot;&gt;${band.label}&lt;/span&gt;
      &lt;div class=&quot;scale-ed-desc&quot;&gt;${info.desc}&lt;/div&gt;
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}

function restartTest(){
  currentQ=0; answers={}; skipped=new Set();
  showScreen(&#x27;screenCover&#x27;);
}
